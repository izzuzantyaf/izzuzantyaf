name: Deploy

on:
  push:
    branches: [main]
    # Docs, agent config and tooling changes do not affect the deployed Worker.
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "tsr.config.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run test

      - run: bunx playwright install --with-deps chromium

      - run: bun run test:e2e

      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
